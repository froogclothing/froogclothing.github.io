<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Chronos Precision</title>
    <link rel="manifest" href="data:application/manifest+json,{'name':'Chronos','short_name':'Chronos','start_url':'.','display':'standalone','background_color':'#050505','theme_color':'#050505'}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #050505;
            --surface: #121212;
            --accent: #ffffff;
            --dim: #262626;
            --safe-top: env(safe-area-inset-top);
        }
        body {
            background-color: var(--bg);
            color: var(--accent);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .timer-ring-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .timer-ring {
            pointer-events: none;
            width: 100%;
            height: auto;
            max-width: 400px;
        }
        .font-numeric {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.05em;
        }
        .center-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .wheel-container {
            height: 120px;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            cursor: ns-resize;
        }
        .wheel-track {
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }
        .wheel-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--dim);
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .wheel-item.active {
            color: var(--accent);
            transform: scale(1.1);
        }
        .glass-panel {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tick {
            stroke: var(--dim);
            stroke-width: 0.5;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        .tick.active {
            stroke: var(--accent);
            stroke-width: 1.2;
        }
        .ball {
            fill: var(--accent);
            transition: r 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #fluid-fill {
            fill: var(--accent);
            opacity: 0.15;
            transition: transform 0.1s linear;
            transform-origin: center;
        }
        #progress-path {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: center;
        }
        .pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="relative flex flex-col items-center justify-between w-full h-full p-6 pb-10" style="padding-top: calc(var(--safe-top) + 24px)">
        <div class="w-full flex justify-between items-center px-4 z-50">
            <h1 class="text-[10px] uppercase tracking-[0.4em] text-neutral-500 font-bold">Chronos Precision</h1>
            <select id="theme-selector" class="bg-transparent text-[10px] uppercase tracking-widest text-neutral-400 border-none outline-none cursor-pointer">
                <option value="classic">Classic</option>
                <option value="fluid">Fluid</option>
                <option value="balls">Orbits</option>
            </select>
        </div>

        <div class="timer-ring-container flex-1">
            <svg id="timer-svg" class="timer-ring" viewBox="0 0 100 100">
                <circle id="fluid-fill" cx="50" cy="50" r="48" class="hidden" />
                <g id="ticks-group"></g>
                <circle id="bg-path" cx="50" cy="50" r="48" fill="none" stroke="var(--dim)" stroke-width="0.3" style="transform: rotate(-90deg); transform-origin: center;" />
                <circle id="progress-path" cx="50" cy="50" r="48" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="301.6" stroke-dashoffset="301.6" stroke-linecap="round" />
                <g id="balls-group" class="hidden"></g>
            </svg>
            <div class="center-group">
                <div id="display" class="text-7xl font-bold font-numeric transition-all duration-500">00:00</div>
                <div id="eta-display" class="text-[10px] uppercase tracking-widest text-neutral-500 mt-4 opacity-0 h-4">Finishing at --:--</div>
            </div>
        </div>

        <div id="selector-ui" class="w-full grid grid-cols-2 gap-4 mb-8 max-w-sm">
            <div class="flex flex-col items-center">
                <span class="text-[9px] uppercase tracking-widest text-neutral-500 mb-2">Minutes</span>
                <div class="wheel-container w-full glass-panel rounded-3xl" id="min-wheel">
                    <div class="wheel-track" id="min-track"></div>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[9px] uppercase tracking-widest text-neutral-500 mb-2">Seconds</span>
                <div class="wheel-container w-full glass-panel rounded-3xl" id="sec-wheel">
                    <div class="wheel-track" id="sec-track"></div>
                </div>
            </div>
        </div>

        <div class="w-full flex flex-col gap-4 max-w-sm">
            <div class="flex gap-3">
                <button id="toggle-btn" class="flex-[3] bg-white text-black font-black py-5 rounded-3xl active:scale-95 transition-all duration-300 text-sm tracking-[0.2em] uppercase shadow-lg shadow-white/5">Start</button>
                <button id="reset-btn" class="flex-1 bg-neutral-900/50 border border-neutral-800/50 font-bold py-5 rounded-3xl active:scale-95 transition-all flex items-center justify-center text-white backdrop-blur-md">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 0, totalTime = 0, timerInterval = null, isRunning = false, isComplete = false, currentTheme = 'classic';
        let selectedMin = 0, selectedSec = 0;
        const STROKE_DASH = 301.6;

        const display = document.getElementById('display');
        const etaDisplay = document.getElementById('eta-display');
        const progressPath = document.getElementById('progress-path');
        const bgPath = document.getElementById('bg-path');
        const fluidFill = document.getElementById('fluid-fill');
        const toggleBtn = document.getElementById('toggle-btn');
        const resetBtn = document.getElementById('reset-btn');
        const selectorUI = document.getElementById('selector-ui');
        const ticksGroup = document.getElementById('ticks-group');
        const ballsGroup = document.getElementById('balls-group');
        const themeSelector = document.getElementById('theme-selector');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClick(freq = 150, type = 'sine', volume = 0.05) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
            if ('vibrate' in navigator) navigator.vibrate(5);
        }

        function initTicks() {
            ticksGroup.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                // -90 degrees puts index 0 at the 12 o'clock position
                const angle = (i * 6 - 90) * (Math.PI / 180);
                const x1 = 50 + 46 * Math.cos(angle);
                const y1 = 50 + 46 * Math.sin(angle);
                const x2 = 50 + (i % 5 === 0 ? 41 : 43) * Math.cos(angle);
                const y2 = 50 + (i % 5 === 0 ? 41 : 43) * Math.sin(angle);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1); line.setAttribute("y1", y1);
                line.setAttribute("x2", x2); line.setAttribute("y2", y2);
                line.setAttribute("class", "tick");
                ticksGroup.appendChild(line);
            }
        }

        function initBalls() {
            ballsGroup.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("r", "1.5");
                circle.setAttribute("class", "ball");
                ballsGroup.appendChild(circle);
            }
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60000);
            const secs = Math.ceil((timeLeft % 60000) / 1000);
            display.textContent = `${mins.toString().padStart(2, '0')}:${(secs >= 60 ? 0 : (secs < 0 ? 0 : secs)).toString().padStart(2, '0')}`;
            
            const percent = totalTime > 0 ? timeLeft / totalTime : 0;
            
            if (currentTheme === 'classic') {
                progressPath.style.strokeDashoffset = STROKE_DASH - percent * STROKE_DASH;
                const lines = ticksGroup.querySelectorAll('.tick');
                const activeCount = Math.floor(percent * 60);
                lines.forEach((l, i) => {
                    l.classList.toggle('active', i <= activeCount);
                });
            } else if (currentTheme === 'fluid') {
                fluidFill.style.transform = `scale(${percent})`;
                progressPath.style.strokeDashoffset = STROKE_DASH - percent * STROKE_DASH;
            } else if (currentTheme === 'balls') {
                const balls = ballsGroup.querySelectorAll('.ball');
                balls.forEach((b, i) => {
                    const angle = ((i / 12) * 360 - 90) * (Math.PI / 180);
                    b.setAttribute("cx", 50 + 48 * Math.cos(angle));
                    b.setAttribute("cy", 50 + 48 * Math.sin(angle));
                    b.setAttribute("r", percent >= i/12 ? 2.5 : 0.8);
                    b.style.opacity = percent >= i/12 ? 1 : 0.3;
                });
            }
        }

        function setupWheel(containerId, trackId, limit, callback) {
            const container = document.getElementById(containerId), track = document.getElementById(trackId), itemHeight = 40;
            let currentOffset = 0, startY = 0, startOffset = 0, isDragging = false;
            
            track.innerHTML = '';
            for (let i = -1; i <= limit; i++) {
                const d = document.createElement('div');
                d.className = 'wheel-item';
                d.textContent = (i < 0 ? limit + i : i % limit).toString().padStart(2, '0');
                track.appendChild(d);
            }
            
            const update = (anim = true) => {
                const targetY = -(currentOffset * itemHeight) + (itemHeight);
                if (anim) anime({ targets: track, translateY: targetY, duration: 400, easing: 'easeOutQuart' });
                else track.style.transform = `translateY(${targetY}px)`;
                Array.from(track.children).forEach((c, i) => c.classList.toggle('active', i === Math.round(currentOffset) + 1));
                callback(Math.round(currentOffset));
            };

            const startDrag = (y) => {
                if (isRunning || isComplete) return;
                isDragging = true;
                startY = y;
                startOffset = currentOffset;
                anime.remove(track);
            };

            const moveDrag = (y) => {
                if (!isDragging) return;
                const delta = (startY - y) / itemHeight;
                const prev = Math.round(currentOffset);
                currentOffset = Math.max(0, Math.min(limit - 1, startOffset + delta));
                if (Math.round(currentOffset) !== prev) playClick(120, 'sine', 0.02);
                update(false);
            };

            const endDrag = () => {
                if (!isDragging) return;
                isDragging = false;
                currentOffset = Math.round(currentOffset);
                update(true);
            };

            container.addEventListener('touchstart', e => startDrag(e.touches[0].clientY), { passive: true });
            container.addEventListener('touchmove', e => { moveDrag(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
            container.addEventListener('touchend', endDrag);

            container.addEventListener('mousedown', e => startDrag(e.clientY));
            window.addEventListener('mousemove', e => moveDrag(e.clientY));
            window.addEventListener('mouseup', endDrag);

            container.addEventListener('wheel', e => {
                if (isRunning || isComplete) return;
                e.preventDefault();
                const delta = e.deltaY > 0 ? 1 : -1;
                const prev = Math.round(currentOffset);
                currentOffset = Math.max(0, Math.min(limit - 1, currentOffset + delta));
                if (Math.round(currentOffset) !== prev) {
                    playClick(120, 'sine', 0.02);
                    update(true);
                }
            }, { passive: false });
            
            update(false);
        }

        function updateETA() {
            if (timeLeft <= 0) { etaDisplay.style.opacity = 0; return; }
            const f = new Date(Date.now() + timeLeft);
            etaDisplay.textContent = `Finishing at ${f.getHours().toString().padStart(2,'0')}:${f.getMinutes().toString().padStart(2,'0')}`;
            etaDisplay.style.opacity = 1;
        }

        function startTimer() {
            isRunning = true; isComplete = false; toggleBtn.textContent = 'Pause';
            toggleBtn.classList.replace('bg-white', 'bg-neutral-900'); toggleBtn.classList.replace('text-black', 'text-white');
            updateETA();
            anime({ targets: selectorUI, opacity: 0.1, scale: 0.95, filter: 'blur(4px)', duration: 800, easing: 'easeOutExpo' });
            
            let last = performance.now();
            const tick = (now) => {
                if (!isRunning) return;
                const delta = now - last; last = now;
                const oldSec = Math.floor(timeLeft / 1000);
                timeLeft -= delta;
                if (Math.floor(timeLeft / 1000) !== oldSec && timeLeft > 0) playClick(80, 'sine', 0.01);
                if (timeLeft <= 0) { timeLeft = 0; completeTimer(); return; }
                updateDisplay(); 
                timerInterval = requestAnimationFrame(tick);
            };
            timerInterval = requestAnimationFrame(tick);
        }

        function pauseTimer() {
            isRunning = false; cancelAnimationFrame(timerInterval);
            toggleBtn.textContent = 'Resume'; toggleBtn.classList.replace('bg-neutral-900', 'bg-white'); toggleBtn.classList.replace('text-white', 'text-black');
            anime({ targets: selectorUI, opacity: 1, scale: 1, filter: 'blur(0px)', duration: 600, easing: 'easeOutExpo' });
        }

        function resetTimer() {
            isRunning = false; isComplete = false; cancelAnimationFrame(timerInterval);
            timeLeft = (selectedMin * 60 + selectedSec) * 1000; totalTime = timeLeft;
            toggleBtn.textContent = 'Start'; toggleBtn.classList.replace('bg-neutral-900', 'bg-white'); toggleBtn.classList.replace('text-white', 'text-black');
            etaDisplay.style.opacity = 0; updateDisplay();
            display.classList.remove('pulse');
            anime({ targets: selectorUI, opacity: 1, scale: 1, filter: 'blur(0px)', duration: 600, easing: 'easeOutExpo' });
        }

        function completeTimer() {
            isRunning = false; isComplete = true; updateDisplay(); toggleBtn.textContent = 'Reset';
            etaDisplay.textContent = 'Timer Complete'; 
            display.classList.add('pulse');
            playClick(440, 'triangle', 0.1); 
            setTimeout(() => playClick(660, 'triangle', 0.1), 150);
        }

        setupWheel('min-wheel', 'min-track', 100, v => { selectedMin = v; if (!isRunning && !isComplete) resetTimer(); });
        setupWheel('sec-wheel', 'sec-track', 60, v => { selectedSec = v; if (!isRunning && !isComplete) resetTimer(); });
        
        toggleBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (isComplete) resetTimer();
            else isRunning ? pauseTimer() : (timeLeft > 0 && startTimer());
        });
        
        resetBtn.addEventListener('click', resetTimer);
        
        themeSelector.addEventListener('change', (e) => {
            currentTheme = e.target.value;
            ticksGroup.classList.toggle('hidden', currentTheme !== 'classic');
            fluidFill.classList.toggle('hidden', currentTheme !== 'fluid');
            ballsGroup.classList.toggle('hidden', currentTheme !== 'balls');
            progressPath.classList.toggle('hidden', currentTheme === 'balls');
            bgPath.classList.toggle('hidden', currentTheme === 'balls');
            
            if (currentTheme === 'classic') progressPath.style.strokeWidth = 1.5;
            else if (currentTheme === 'fluid') progressPath.style.strokeWidth = 1.0;

            updateDisplay();
        });

        window.onload = () => {
            initTicks();
            initBalls();
            updateDisplay();
        };
    </script>
</body>
</html>
